# Headless sway for scripts/wayland_window_pixels.sh: one output, no Xwayland,
# and windows float without borders so they keep the size they ask for.
xwayland disable
output HEADLESS-1 resolution 1280x800 position 0 0 scale 1
default_border none
default_floating_border none
for_window [title=".*"] floating enable, move position 0 0
