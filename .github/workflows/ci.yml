name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare check logs
        run: mkdir -p ci-results

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Check minimum Rust and acceptance examples
        run: cargo +1.88.0 check --locked --lib --example counter --example native_dogfood 2>&1 | tee ci-results/msrv.log

      - name: Check minimum Rust with the wgpu backend
        run: cargo +1.88.0 check --locked --lib --features wgpu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compare runner regression (no GPU workload)
        run: python3 benchmarks/gpui_compare/test_runner.py

      - name: cargo check
        run: cargo check 2>&1 | tee ci-results/check.log

      - name: cargo test
        run: cargo test 2>&1 | tee ci-results/test.log

      - name: Update-path tests without a rendering backend
        # The command docs/getting-started.md gives; it builds the library
        # with neither Metal nor wgpu.
        run: cargo test --no-default-features --test view_listener --test listener_workflow --test view_updates

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings 2>&1 | tee ci-results/clippy.log

      - name: wgpu backend against Metal
        run: |
          cargo clippy --all-targets --features wgpu -- -D warnings
          cargo test --features wgpu --lib renderer::wgpu

      - name: Update-path tests without a rendering backend
        # The command docs/getting-started.md gives: neither Metal nor wgpu is compiled.
        run: cargo test --no-default-features --test view_listener --test listener_workflow --test view_updates

      - name: Performance gate
        run: cargo bench --bench perf_gate 2>&1 | tee ci-results/perf-gate.log

      - name: Text cache gate
        run: cargo bench --bench text_cache 2>&1 | tee ci-results/text-cache.log

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  winit-linux:
    # The window references in tests/linux_window/ were drawn by this image's
    # Mesa lavapipe and DejaVu fonts.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install X11, lavapipe and fonts
        run: |
          sudo apt-get update
          # winit loads the X11 and xkbcommon libraries at runtime; xdotool
          # and ImageMagick drive and capture the windows, xclip is the other
          # app on the clipboard. at-spi2-core, gdbus and the Atspi bindings
          # read the accessibility tree back as a screen reader would.
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 xdotool xclip imagemagick fonts-dejavu-core dbus-daemon at-spi2-core libglib2.0-bin python3-gi gir1.2-atspi-2.0

      - name: Check the winit runner and examples
        run: cargo check --locked --no-default-features --features winit --lib --example hello_world --example counter --example multi_window

      - name: Library tests without Metal
        run: cargo test --locked --no-default-features --features winit --lib

      - name: Compare window pixels on lavapipe under Xvfb
        run: |
          cargo build --locked --no-default-features --features winit --example hello_world --example counter --example multi_window --example interaction_acceptance --example controls
          xvfb-run -a -s "-screen 0 1024x768x24" scripts/linux_window_pixels.sh

      - name: Read the accessibility tree back over AT-SPI
        run: xvfb-run -a -s "-screen 0 1024x768x24" dbus-run-session -- scripts/linux_atspi_tree.sh

      - name: Upload window captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-window-pixels
          path: |
            target/linux-window-pixels
            target/linux-atspi

  winit-wayland:
    # The window references in tests/wayland_window/ were drawn by this image's
    # Mesa lavapipe and DejaVu fonts under a headless sway.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install sway, lavapipe and fonts
        run: |
          sudo apt-get update
          # sway is the headless compositor; its seat clicks, wtype types,
          # grim captures and wl-clipboard is the other app on the clipboard.
          # at-spi2-core, gdbus and the Atspi bindings read the accessibility
          # tree back as a screen reader would.
          sudo apt-get install -y sway grim wtype wl-clipboard jq mesa-vulkan-drivers libxkbcommon0 libwayland-client0 libwayland-cursor0 imagemagick fonts-dejavu-core dbus-daemon at-spi2-core libglib2.0-bin python3-gi gir1.2-atspi-2.0

      - name: Compare window pixels on lavapipe under Wayland
        run: |
          cargo build --locked --no-default-features --features winit --example hello_world --example counter --example interaction_acceptance --example controls
          scripts/wayland_window_pixels.sh

      - name: Read the accessibility tree back over AT-SPI under Wayland
        run: dbus-run-session -- scripts/wayland_atspi_tree.sh

      - name: Upload window captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-window-pixels
          path: |
            target/wayland-window-pixels
            target/wayland-atspi

  winit-windows:
    # The window references in tests/windows_window/ were drawn by this image's
    # DX12 WARP adapter and Segoe UI at 100% scaling.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the winit runner and examples
        run: cargo check --locked --no-default-features --features winit --lib --example hello_world --example counter --example multi_window

      - name: Library tests without Metal
        run: cargo test --locked --no-default-features --features winit --lib

      - name: Compare window pixels
        shell: powershell
        run: |
          cargo build --locked --no-default-features --features winit --example hello_world --example counter --example interaction_acceptance --example controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows_window_pixels.ps1

      - name: Read the accessibility tree back through UI Automation
        shell: powershell
        run: ./scripts/windows_uia_tree.ps1

      - name: Upload window captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-window-pixels
          path: |
            target/windows-window-pixels
            target/windows-uia
