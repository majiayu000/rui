name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Check minimum Rust and acceptance examples
        run: cargo +1.88.0 check --locked --lib --example counter --example native_dogfood

      - name: Check minimum Rust with the wgpu backend
        run: cargo +1.88.0 check --locked --lib --features wgpu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: wgpu backend against Metal
        run: |
          cargo clippy --all-targets --features wgpu
          cargo test --features wgpu --lib renderer::wgpu

      - name: Performance gate
        run: cargo bench --bench perf_gate

  winit-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check the winit runner and examples
        run: cargo check --locked --no-default-features --features winit --lib --example hello_world --example counter

      - name: Library tests without Metal
        run: cargo test --locked --no-default-features --features winit --lib

      - name: Open hello_world on lavapipe under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          cargo build --locked --no-default-features --features winit --example hello_world
          # The example runs until its window closes: surviving the timeout
          # means the window, surface, device and first frames came up.
          status=0
          RUST_LOG=rui=info timeout 10 xvfb-run -a target/debug/examples/hello_world 2> run.log || status=$?
          cat run.log
          test "$status" -eq 124
          grep -q "winit window presenting through" run.log
