name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare check logs
        run: mkdir -p ci-results

      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Check minimum Rust and acceptance examples
        run: cargo +1.88.0 check --locked --lib --example counter --example native_dogfood 2>&1 | tee ci-results/msrv.log

      - name: Check minimum Rust with the wgpu backend
        run: cargo +1.88.0 check --locked --lib --features wgpu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check 2>&1 | tee ci-results/check.log

      - name: cargo test
        run: cargo test 2>&1 | tee ci-results/test.log

      - name: cargo clippy
        run: cargo clippy --all-targets 2>&1 | tee ci-results/clippy.log

      - name: wgpu backend against Metal
        run: |
          cargo clippy --all-targets --features wgpu
          cargo test --features wgpu --lib renderer::wgpu

      - name: Performance gate
        run: cargo bench --bench perf_gate 2>&1 | tee ci-results/perf-gate.log

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn
